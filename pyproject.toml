[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "georeport3d"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "geoalchemy2>=0.18,<1",
  "orjson>=3.11,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]
document = [
  "docling>=2,<3",
  "python-docx>=1.2,<2",
  # Declared directly rather than leaned on as a Docling transitive: the page
  # renderer imports both, and a transitive dependency can be dropped by an
  # upstream release without warning.
  "pypdfium2>=4,<6",
  "pillow>=10,<13",
]
modal = ["modal>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["georeport3d*", "apps*", "ai*", "document*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires an explicitly authorized local PostGIS test service",
  "docling: requires the optional document extra and its Docling backend",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# sys.path is adjusted before the package imports so this test can run standalone.
"tests/inference/test_modal_provider.py" = ["E402"]
