# Local-test credentials only; never reuse in production.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: georeport3d_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d georeport3d_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - georeport3d-postgis:/var/lib/postgresql/data

volumes:
  georeport3d-postgis:
