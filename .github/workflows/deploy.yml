name: Deploy (Modal)

# Manual only. This workflow must never be triggered by pull_request: the
# repository is public, and a fork must not be able to spend the Modal budget.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm. Building and registering the app can incur charges before any inference.'
        required: true
        default: ""

permissions:
  contents: read

# A second deploy must queue rather than race the first.
concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: modal deploy
    runs-on: ubuntu-latest
    environment: modal-production
    env:
      MODAL_ENVIRONMENT: main
    steps:
      - name: Require explicit confirmation
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "${DEPLOY_CONFIRM}" != "deploy" ]]; then
            echo "::error::Confirmation must be exactly 'deploy'."
            exit 1
          fi

      - name: Require the main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [[ "${DEPLOY_REF}" != "refs/heads/main" ]]; then
            echo "::error::Modal production deployment requires refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --python 3.13 --extra modal

      # Registers the app declarations. It does not call QwenWorker.extract_batch,
      # so no GPU is allocated and no inference runs. Weights are fetched into the
      # Modal volume on the first authorized invocation, never onto a runner.
      - name: Deploy the worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_ID_SECRET }}
        run: uv run --python 3.13 modal deploy --env main deployment/modal_worker.py

      # A normal step runs only after the deploy succeeds. Identity comes from
      # reviewed source, never from a workflow input or shell interpolation.
      - name: Record deployed identity and rollback
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          echo "deployed_commit=${DEPLOYED_COMMIT}"
          uv run --python 3.13 python -c "from georeport3d.model_identity import MODEL_ID, MODEL_REVISION; print(f'deployed_model={MODEL_ID}'); print(f'deployed_revision={MODEL_REVISION}')"
          echo "Roll back by reverting the deployment commit on main, then re-run this workflow from refs/heads/main."
